<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ventas Xiaomi</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f6f5f3;--card:#fff;--ink:#1d1d1f;--mute:#76736e;--line:#e6e3de;--acc:#ff6900;--ok:#1f8a4c;--bad:#c93c2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161514;--card:#201f1d;--ink:#f3f1ee;--mute:#9b978f;--line:#33312e}}
:root[data-theme="dark"]{--bg:#161514;--card:#201f1d;--ink:#f3f1ee;--mute:#9b978f;--line:#33312e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Manrope,system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;margin:4px 0 14px}
h2{font-size:15px;font-weight:800;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.mute{color:var(--mute);font-size:13px}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:7px;transition:width .5s}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid .card{padding:12px}
.grid b{display:block;font-size:18px;font-weight:800}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:13px 16px;background:var(--acc);color:#fff;cursor:pointer;width:100%;margin-top:16px}
button.sm{width:auto;margin:0;padding:6px 10px;background:var(--line);color:var(--ink);font-size:13px}
button.del{color:var(--bad)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item small{display:block;color:var(--mute)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line)}
.tag.web{background:#ff69001f;color:var(--acc)}
.low{color:var(--bad)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;margin:0;border-radius:0;background:none;color:var(--mute);padding:15px 4px}
nav button[aria-current="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.msg{margin-top:12px;color:var(--ok);font-weight:600}
.err{color:var(--bad)}
.empty{color:var(--mute);padding:14px 0}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
// Pega aquí la configuración de tu proyecto Firebase
const FB={apiKey:"AIzaSyD5qNPxkilVxYG6amD4iSveXhruDC6wbl8",authDomain:"ventas-xiaomi.firebaseapp.com",projectId:"ventas-xiaomi",storageBucket:"ventas-xiaomi.firebasestorage.app",messagingSenderId:"244391744909",appId:"1:244391744909:web:434a86d511e78ed2b699c4"};
firebase.initializeApp(FB);
const auth=firebase.auth(),fs=firebase.firestore();
const EMPTY=()=>({meta:0,products:[],sales:[]});
let S=EMPTY(),tab='panel',msg='',user=null,ref=null,ready=false,status='',loginErr='',tm;
const save=()=>{if(!ref)return;status='Guardando…';paintStatus();clearTimeout(tm);
  tm=setTimeout(()=>ref.set(JSON.parse(JSON.stringify(S))).then(()=>{status='Guardado en la nube';paintStatus()}).catch(()=>{status='Sin conexión: no se pudo guardar';paintStatus()}),400)};
auth.onAuthStateChanged(async u=>{
  user=u;ref=null;S=EMPTY();
  if(u){ref=fs.doc('users/'+u.uid);try{const d=await ref.get();if(d.exists)S=Object.assign(EMPTY(),d.data());status='Guardado en la nube'}catch(e){status='No se pudieron cargar tus datos'}}
  ready=true;render();
});
const $=n=>'$'+Math.round(n).toLocaleString('es-CL');
const M=n=>'$'+(n/1e6).toLocaleString('es-CL',{maximumFractionDigits:2})+' M';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.toISOString().slice(0,10)};
const ym=d=>d.slice(0,7);
const monthSales=()=>S.sales.filter(s=>ym(s.date)===ym(today()));
const counted=()=>monthSales().filter(s=>s.counts).reduce((a,s)=>a+s.price*s.qty,0);

function panel(){
  const v=counted(),meta=S.meta,falta=Math.max(meta-v,0),pct=meta?Math.min(v/meta*100,100):0;
  const now=new Date(),last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),dl=Math.max(last-now.getDate()+1,1);
  const mn=now.toLocaleDateString('es-CL',{month:'long',year:'numeric'});
  const recent=S.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return `<h1>Meta de ${esc(mn)}</h1>
  <div class="card">
    <div class="mute">Llevas vendido (precio etiqueta)</div>
    <div class="big">${M(v)}</div>
    <div class="bar" role="progressbar" aria-valuenow="${pct.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="row mute"><span>${pct.toFixed(0)}% de ${meta?M(meta):'sin meta'}</span><span>${meta&&v>=meta?'Meta cumplida':'Faltan '+M(falta)}</span></div>
  </div>
  <div class="grid">
    <div class="card"><span class="mute">Falta por vender</span><b>${meta?$(falta):'—'}</b></div>
    <div class="card"><span class="mute">Ritmo diario necesario</span><b>${meta&&falta?$(falta/dl):'—'}</b><span class="mute">${dl} días restantes</span></div>
    <div class="card"><span class="mute">Equipos vendidos</span><b>${monthSales().reduce((a,s)=>a+s.qty,0)}</b></div>
    <div class="card"><span class="mute">Equipos en bodega</span><b>${S.products.reduce((a,p)=>a+p.qty,0)}</b></div>
  </div>
  <h2>Meta del mes</h2>
  <div class="card"><label for="meta" style="margin-top:0">Meta en pesos (ej: 25000000)</label>
  <input id="meta" type="number" inputmode="numeric" value="${meta||''}" placeholder="25000000">
  <button onclick="setMeta()">Guardar meta</button></div>
  <h2>Últimas ventas</h2>
  <div class="card">${recent.length?recent.map(saleRow).join(''):'<div class="empty">Aún no registras ventas este mes. Ve a Vender para empezar.</div>'}</div>
  <p class="mute" id="st" style="margin-top:18px">${status}</p><button class="sm" onclick="auth.signOut()">Cerrar sesión</button>`;
}
function saleRow(s,del){return `<div class="item"><div>${esc(s.name)} ×${s.qty}<small>${s.date} · <span class="tag ${s.channel==='Internet'?'web':''}">${s.channel}</span>${s.counts?'':' · no cuenta para meta'}</small></div>
<div style="text-align:right"><b>${$(s.price*s.qty)}</b>${del?`<br><button class="sm del" onclick="delSale('${s.id}')">Anular</button>`:''}</div></div>`}

function vender(){
  const avail=S.products.filter(p=>p.qty>0);
  const hist=S.sales.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,30);
  return `<h1>Registrar venta</h1>
  <div class="card">${avail.length?`
  <label for="vp" style="margin-top:0">Equipo</label>
  <select id="vp">${avail.map(p=>`<option value="${p.id}">${esc(p.name)} — ${$(p.price)} (${p.qty} en stock)</option>`).join('')}</select>
  <label for="vq">Cantidad</label><input id="vq" type="number" inputmode="numeric" min="1" value="1">
  <label for="vc">Canal</label><select id="vc" onchange="document.getElementById('vm').checked=true"><option>Tienda</option><option>Internet</option></select>
  <label for="vd">Fecha</label><input id="vd" type="date" value="${today()}">
  <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input id="vm" type="checkbox" checked style="width:auto"> Cuenta para mi meta</label>
  <button onclick="venta()">Registrar venta</button>`:'<div class="empty">No hay equipos con stock. Ingresa equipos en la pestaña Stock.</div>'}
  ${msg?`<div class="msg ${msg.startsWith('!')?'err':''}">${esc(msg.replace(/^!/,''))}</div>`:''}</div>
  <h2>Historial</h2><div class="card">${hist.length?hist.map(s=>saleRow(s,1)).join(''):'<div class="empty">Sin ventas registradas.</div>'}</div>`;
}
function stock(){
  const ps=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name));
  return `<h1>Stock en bodega</h1>
  <div class="card"><div class="mute" style="margin-bottom:4px">Ingresar equipos. Si el modelo ya existe, se suma al stock.</div>
  <label for="sn">Modelo</label><input id="sn" placeholder="Redmi Note 14 128GB" autocomplete="off">
  <label for="sp">Precio etiqueta (pesos)</label><input id="sp" type="number" inputmode="numeric" placeholder="199990">
  <label for="sq">Cantidad que llega</label><input id="sq" type="number" inputmode="numeric" min="1" value="1">
  <button onclick="ingreso()">Ingresar a bodega</button>
  ${msg?`<div class="msg ${msg.startsWith('!')?'err':''}">${esc(msg.replace(/^!/,''))}</div>`:''}</div>
  <h2>Inventario (${ps.reduce((a,p)=>a+p.qty,0)} equipos · ${$(ps.reduce((a,p)=>a+p.qty*p.price,0))} en etiqueta)</h2>
  <div class="card">${ps.length?ps.map(p=>`<div class="item"><div>${esc(p.name)}<small>${$(p.price)}</small><button class="sm del" style="margin-top:6px" onclick="delProd('${p.id}')">Eliminar</button></div>
  <div style="display:flex;gap:6px;align-items:center"><button class="sm" aria-label="Quitar uno" onclick="adj('${p.id}',-1)">−1</button><b class="${p.qty<=2?'low':''}" style="min-width:28px;text-align:center">${p.qty}</b><button class="sm" aria-label="Sumar uno" onclick="adj('${p.id}',1)">+1</button></div></div>`).join(''):'<div class="empty">Bodega vacía. Ingresa tu primer equipo arriba.</div>'}</div>`;
}
const num=id=>parseFloat(document.getElementById(id).value);
function setMeta(){const m=num('meta');if(m>=0){S.meta=m;save();msg='';render()}}
function ingreso(){
  const n=document.getElementById('sn').value.trim(),p=num('sp'),q=Math.floor(num('sq'));
  if(!n||!(p>0)||!(q>0)){msg='!Completa modelo, precio y cantidad.';return render()}
  let e=S.products.find(x=>x.name.toLowerCase()===n.toLowerCase());
  if(e){e.qty+=q;e.price=p}else S.products.push({id:uid(),name:n,price:p,qty:q});
  save();msg=`Ingresaste ${q} × ${n}.`;render()
}
function delProd(id){
  const p=S.products.find(x=>x.id===id);if(!p||!confirm('¿Eliminar "'+p.name+'" del stock? Las ventas ya registradas no se borran.'))return;
  S.products=S.products.filter(x=>x.id!==id);save();msg='';render()
}
function adj(id,d){const p=S.products.find(x=>x.id===id);if(p){p.qty=Math.max(0,p.qty+d);save();render()}}
function venta(){
  const p=S.products.find(x=>x.id===document.getElementById('vp').value),q=Math.floor(num('vq'));
  if(!p||!(q>0)){msg='!Indica una cantidad válida.';return render()}
  if(q>p.qty){msg=`!Solo hay ${p.qty} en stock de ${p.name}.`;return render()}
  p.qty-=q;
  S.sales.push({id:uid(),date:document.getElementById('vd').value||today(),pid:p.id,name:p.name,price:p.price,qty:q,channel:document.getElementById('vc').value,counts:document.getElementById('vm').checked});
  save();msg=`Venta registrada: ${q} × ${p.name}. Stock descontado.`;render()
}
function delSale(id){
  const s=S.sales.find(x=>x.id===id);if(!s||!confirm('¿Anular esta venta? El equipo vuelve al stock.'))return;
  const p=S.products.find(x=>x.id===s.pid);if(p)p.qty+=s.qty;else S.products.push({id:s.pid,name:s.name,price:s.price,qty:s.qty});
  S.sales=S.sales.filter(x=>x.id!==id);save();msg='';render()
}
function go(t){tab=t;msg='';render();window.scrollTo(0,0)}
function loginView(){return `<h1>Ventas Xiaomi</h1><div class="card">
  <label for="em" style="margin-top:0">Correo</label><input id="em" type="email" autocomplete="username">
  <label for="pw">Clave</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Ingresar</button>${loginErr?`<div class="msg err">${esc(loginErr)}</div>`:''}</div>`}
function login(){loginErr='';auth.signInWithEmailAndPassword(document.getElementById('em').value.trim(),document.getElementById('pw').value).catch(()=>{loginErr='Correo o clave incorrectos.';render()})}
function paintStatus(){const e=document.getElementById('st');if(e)e.textContent=status}
function render(){
  if(!ready||!user){document.getElementById('nav').innerHTML='';document.getElementById('app').innerHTML=ready?loginView():'<p class="mute">Cargando…</p>';return}
  document.getElementById('app').innerHTML=tab==='panel'?panel():tab==='vender'?vender():stock();
  document.getElementById('nav').innerHTML=[['panel','Panel'],['vender','Vender'],['stock','Stock']].map(([k,l])=>`<button onclick="go('${k}')" aria-current="${tab===k}">${l}</button>`).join('');
}
render();
</script>
</body>
</html>
